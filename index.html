<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Mục Tổng Hợp 300 Trang Ôn Tập & Bài Học</title>
    <style>
        :root {
            --primary-glow: #7928CA;
            --secondary-glow: #00F2FE;
            --accent-gold: #FFD700;
            --accent-pink: #FF0080;
            --bg-card: rgba(15, 23, 42, 0.82);
            --border-card: rgba(255, 255, 255, 0.15);
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-main);
            background: #030712;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            line-height: 1.6;
        }

        /* Background Vũ Trụ */
        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(ellipse at bottom, #0d1527 0%, #030712 100%);
            overflow: hidden;
        }

        .nebula {
            position: absolute;
            width: 700px;
            height: 700px;
            border-radius: 50%;
            filter: blur(140px);
            opacity: 0.35;
            animation: float 25s infinite alternate ease-in-out;
        }

        .nebula-1 {
            top: -150px;
            left: -100px;
            background: var(--primary-glow);
        }

        .nebula-2 {
            bottom: -150px;
            right: -100px;
            background: var(--secondary-glow);
            animation-delay: -10s;
        }

        .nebula-3 {
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--accent-pink);
            width: 500px;
            height: 500px;
            opacity: 0.18;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(70px, -50px) scale(1.15); }
        }

        /* Layout Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Header Styling */
        header {
            text-align: center;
            margin-bottom: 35px;
            padding: 35px 25px;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 24px;
            backdrop-filter: blur(16px);
            box-shadow: 0 0 35px rgba(0, 242, 254, 0.15);
        }

        .badge {
            display: inline-block;
            padding: 6px 18px;
            border-radius: 50px;
            background: linear-gradient(90deg, var(--accent-gold), var(--primary-glow));
            color: #000;
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 14px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFF 30%, var(--accent-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.05rem;
        }

        /* Search & Filter Bar */
        .controls-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 20px;
            padding: 22px 28px;
            margin-bottom: 30px;
            backdrop-filter: blur(12px);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: space-between;
            align-items: center;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 260px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 18px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-card);
            color: #FFF;
            font-size: 1rem;
            outline: none;
            transition: all 0.25s ease;
        }

        .search-box input:focus {
            border-color: var(--secondary-glow);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.25);
            background: rgba(255, 255, 255, 0.08);
        }

        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .filter-btn {
            padding: 8px 14px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-card);
            color: var(--text-main);
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            background: linear-gradient(135deg, var(--primary-glow), var(--secondary-glow));
            border-color: transparent;
            color: #FFF;
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.3);
        }

        /* Grid Links Container */
        .grid-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(14px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .grid-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 12px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        .grid-title {
            font-size: 1.3rem;
            color: var(--accent-gold);
            font-weight: 700;
        }

        .count-badge {
            color: var(--secondary-glow);
            font-weight: bold;
        }

        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 12px;
        }

        .link-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 14px 10px;
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.25s ease;
        }

        .link-item .num {
            font-size: 1.1rem;
            color: var(--accent-gold);
            font-weight: 800;
            margin-bottom: 2px;
        }

        .link-item .label {
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .link-item:hover {
            background: rgba(0, 242, 254, 0.15);
            border-color: var(--secondary-glow);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 242, 254, 0.25);
        }

        .link-item:hover .label {
            color: #FFF;
        }

        /* Footer Nav */
        footer {
            text-align: center;
            padding: 25px;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <div class="stars-container">
        <div class="nebula nebula-1"></div>
        <div class="nebula nebula-2"></div>
        <div class="nebula nebula-3"></div>
    </div>

    <div class="container">
        <!-- Header -->
        <header>
            <span class="badge">Hệ Thống Quản Lý Bài Học</span>
            <h1>DANH MỤC TỔNG HỢP 300 TRANG ÔN TẬP</h1>
            <p class="subtitle">Truy cập nhanh từ Trang 1 (index1.html) đến Trang 300 (index300.html)</p>
        </header>

        <!-- Thanh Tìm Kiếm & Lọc Theo Khoảng -->
        <div class="controls-card">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Nhập số trang (ví dụ: 1, 25, 300)..." oninput="filterLinks()">
            </div>
            <div class="filter-buttons">
                <button class="filter-btn active" onclick="setRange(1, 300, this)">Tất cả (1-300)</button>
                <button class="filter-btn" onclick="setRange(1, 50, this)">1 - 50</button>
                <button class="filter-btn" onclick="setRange(51, 100, this)">51 - 100</button>
                <button class="filter-btn" onclick="setRange(101, 150, this)">101 - 150</button>
                <button class="filter-btn" onclick="setRange(151, 200, this)">151 - 200</button>
                <button class="filter-btn" onclick="setRange(201, 250, this)">201 - 250</button>
                <button class="filter-btn" onclick="setRange(251, 300, this)">251 - 300</button>
            </div>
        </div>

        <!-- Lưới Đường Link -->
        <div class="grid-card">
            <div class="grid-header">
                <div class="grid-title">🚀 Danh Sách Đường Link</div>
                <div class="count-badge">Hiển thị: <span id="visibleCount">300</span> / 300 Trang</div>
            </div>
            <div class="links-grid" id="linksGrid">
                <!-- Javascript sẽ tự động sinh 300 links từ index1.html đến index300.html -->
            </div>
        </div>

        <footer>
            <p>© Trang Chủ Cổng Bài Học • Tự động tổng hợp liên kết từ index1.html đến index300.html</p>
        </footer>
    </div>

    <script>
        let currentStart = 1;
        let currentEnd = 300;

        // Hàm khởi tạo 300 liên kết
        function generateLinks() {
            const grid = document.getElementById('linksGrid');
            grid.innerHTML = '';

            for (let i = 1; i <= 300; i++) {
                const a = document.createElement('a');
                a.href = `index${i}.html`;
                a.className = 'link-item';
                a.dataset.index = i;
                a.innerHTML = `
                    <span class="num">${i}</span>
                    <span class="label">index${i}.html</span>
                `;
                grid.appendChild(a);
            }
            updateVisibility();
        }

        // Lọc theo khoảng trang
        function setRange(start, end, btn) {
            currentStart = start;
            currentEnd = end;

            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            document.getElementById('searchInput').value = '';
            updateVisibility();
        }

        // Tìm kiếm / Lọc theo ô nhập liệu
        function filterLinks() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const items = document.querySelectorAll('.link-item');
            let count = 0;

            items.forEach(item => {
                const idx = parseInt(item.dataset.index);
                const filename = `index${idx}.html`.toLowerCase();

                let matchesRange = (idx >= currentStart && idx <= currentEnd);
                let matchesSearch = (query === '' || idx.toString().includes(query) || filename.includes(query));

                if (matchesRange && matchesSearch) {
                    item.style.display = 'flex';
                    count++;
                } else {
                    item.style.display = 'none';
                }
            });

            document.getElementById('visibleCount').innerText = count;
        }

        function updateVisibility() {
            filterLinks();
        }

        // Chạy khi trang tải xong
        window.onload = generateLinks;
    </script>
</body>
</html>
